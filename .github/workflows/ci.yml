name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: make
      - name: unit and end-to-end tests
        run: make test
      - name: zsh hook smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          ./test/hook-zsh.sh

  musl:
    # glibc-isms in the shim would surface here; informational for now
    runs-on: ubuntu-latest
    continue-on-error: true
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: apk add --no-cache bash build-base go coreutils diffutils make git
      - name: build and test
        run: make test
